name: Compilar FotoJAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Preparar proyecto Android
        run: python3 tool/prepare_platforms.py android
      - name: Clave de firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp tool/fotojas-debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - name: Análisis de código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk FotoJAS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FotoJAS-android
          path: FotoJAS.apk

  windows:
    name: Programa Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Preparar proyecto Windows
        run: python tool/prepare_platforms.py windows
      - run: flutter pub get
      - name: Compilar Windows
        run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath FotoJAS-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FotoJAS-windows
          path: FotoJAS-Windows.zip

  release:
    name: Publicar versión
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FotoJAS v1.0.${{ github.run_number }}
          body: |
            Descarga:
            - **FotoJAS.apk** → móvil o tablet Android
            - **FotoJAS-Windows.zip** → descomprimir y abrir `fotojas.exe`
          files: |
            dist/FotoJAS.apk
            dist/FotoJAS-Windows.zip
